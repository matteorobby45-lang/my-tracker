<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {

            card: '#10141F',

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      background-color: #07090E;
      color: #F1F5F9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior-y: none;
      margin: 0;
      padding: 0;
    }
    .safe-top {
      padding-top: max(14px, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    .main-scroll {
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
    /* Custom range slider per sfumature percentuali */
    input[type="range"].pct-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #1D2436;
      outline: none;
    }
    input[type="range"].pct-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2DD4BF, #38BDF8);
      cursor: pointer;
      border: 2px solid #07090E;
      box-shadow: 0 0 8px rgba(45, 212, 191, 0.45);
    }
    /* Nascondi scrollbar su barre orizzontali */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes shakePin {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .animate-shake {
      animation: shakePin 0.35s ease-in-out;
    }
    .dragging-row {
      opacity: 0.55;
      border-color: rgba(45, 212, 191, 0.6) !important;
      background-color: #161C2B !important;
    }
  </style>
</head>
<body class="bg-oled text-slate-100 antialiased selection:bg-teal-500/30">

  <!-- ===================================================================== -->
  <script>
    // =========================================================================
    // A. GESTIONE PIN DI SICUREZZA (12112004)
    // =========================================================================
    const APP_PIN = '12112004';
    const PIN_SESSION_KEY = 'il_mio_spazio_unlocked_v2';
    let enteredPin = '';

    function isAppUnlocked() {
      try {
        return sessionStorage.getItem(PIN_SESSION_KEY) === 'true';
      } catch (e) {
        return false;
      }
    }

    function updatePinDotsUI() {
      const dots = document.querySelectorAll('#pin-dots-container .pin-dot');
      dots.forEach((dot, idx) => {
        if (idx < enteredPin.length) {
          dot.classList.remove('border-slate-600', 'bg-transparent');
          dot.classList.add('border-teal-400', 'bg-gradient-to-tr', 'from-teal-400', 'to-sky-400', 'scale-110');
        } else {
          dot.classList.add('border-slate-600', 'bg-transparent');
          dot.classList.remove('border-teal-400', 'bg-gradient-to-tr', 'from-teal-400', 'to-sky-400', 'scale-110');
        }
      });
    }

    function handlePinKey(digit) {
      if (enteredPin.length >= APP_PIN.length) return;
      enteredPin += digit;
      updatePinDotsUI();

      if (enteredPin.length === APP_PIN.length) {
        if (enteredPin === APP_PIN) {
          try { sessionStorage.setItem(PIN_SESSION_KEY, 'true'); } catch (e) {}
          unlockAppUI();
        } else {
          const dotsContainer = document.getElementById('pin-dots-container');
          const statusText = document.getElementById('pin-status-text');
          dotsContainer.classList.remove('animate-shake');
          void dotsContainer.offsetWidth;
          dotsContainer.classList.add('animate-shake');
          statusText.textContent = 'PIN errato, riprova';
          statusText.classList.remove('text-slate-400');
          statusText.classList.add('text-rose-400');

          setTimeout(() => {
            enteredPin = '';
            updatePinDotsUI();
            statusText.textContent = 'Codice di sicurezza a 8 cifre';
            statusText.classList.add('text-slate-400');
            statusText.classList.remove('text-rose-400');
          }, 450);
        }
      }
    }

    function backspacePinInput() {
      if (enteredPin.length === 0) return;
      enteredPin = enteredPin.slice(0, -1);
      updatePinDotsUI();
    }

    function clearPinInput() {
      enteredPin = '';
      updatePinDotsUI();
    }

    function unlockAppUI() {
      document.getElementById('pin-lock-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      performDailyRollover();
      render();
    }

    function lockAppManually() {
      try { sessionStorage.removeItem(PIN_SESSION_KEY); } catch (e) {}
      enteredPin = '';
      updatePinDotsUI();
      closeModal();
      document.getElementById('app').classList.add('hidden');
      document.getElementById('pin-lock-screen').classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (isAppUnlocked()) return;
      if (e.key >= '0' && e.key <= '9') handlePinKey(e.key);
      else if (e.key === 'Backspace') backspacePinInput();
      else if (e.key === 'Escape') clearPinInput();
    });

    // =========================================================================
    // B. STATO INIZIALE & STRUTTURA DATI COMPLETA
    // =========================================================================
    const STORAGE_KEY = 'il_mio_spazio_data_v2';

    function getTodayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getCurrentMonthKey() {
      return getTodayISO().slice(0, 7); // YYYY-MM
    }

    function getCurrentWeekKey() {
      const d = new Date();
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
      return `${date.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function formatItalianDate(isoStr) {
      const parts = isoStr.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const str = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function formatMonthLabel(ym) {
      const [y, m] = ym.split('-');
      const d = new Date(Number(y), Number(m) - 1, 1);
      const str = d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function getDefaultState() {
      const today = getTodayISO();
      const monthKey = getCurrentMonthKey();
      return {
        currentDate: today,
        newItemType: 'routine', // 'routine' (-) oppure 'task' ([ ])
        expandActionDetails: false,
        showLifeGoals: false,
        percorsiSubTab: 'albero', // 'albero' | 'report'
        finanzePeriod: 'mensile', // 'mensile' | 'annuale'
        finanzeFilter: 'all',
        showTxHistory: false,
        expandedPastDays: {},
        expandedTreeNodes: {
          cat_carriera: true,
          cat_crescita: true,
        },
        // Lista giornaliera cronologica mista
        dailyItems: [
          { id: uid('d'), type: 'routine', text: 'Colazione e acqua', done: false },
          { id: uid('d'), type: 'task', text: 'Studiare Cybersecurity (10:30)', done: false },
          { id: uid('d'), type: 'routine', text: 'Pranzo senza schermi', done: false },
          { id: uid('d'), type: 'task', text: 'Rivedere piano laurea magistrale', done: false },
          { id: uid('d'), type: 'routine', text: 'Tempo libero / lettura', done: false },
        ],
        // Cose da fare / Reminder (generiche + task non completate riportate automaticamente)
        reminders: [
          { id: uid('r'), text: 'Vedere video approfondimento sicurezza reti', sourceDate: null },
          { id: uid('r'), text: 'Pianificare sessione esami prossima', sourceDate: null },
        ],
        // Storico liste passate
        dailyHistory: [],
        // 10 Obiettivi di vita
        lifeGoals: [
          '1) Essere una persona che si conosce e lavora su se stesso',
          '2) Vivere pienamente il presente',
          '3) Agire attivamente seguendo i miei interessi',
          '4) Non dipendere dalla tecnologia',
          '5) Ascoltare a fondo',
          '6) Costruire un\'azienda e farla funzionare',
          '7) Gestire i soldi in maniera efficace',
          '8) Rimanere attivo e in salute',
          '9) Dedicare tempo a famiglia e amici',
          '10) Diventare esperto nella cybersecurity'
        ],
        // 4 Macro-Aree -> Sotto-obiettivi -> Azioni/Steps
        categoriesTree: [
          {
            id: 'cat_carriera',

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        const def = getDefaultState();
        return {
          ...def,
          ...parsed,
          finance: { ...def.finance, ...(parsed.finance || {}) }
        };
      } catch (e) {
        return getDefaultState();
      }
    }

    let state = loadState();
    let activeTab = 'oggi';

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('Errore salvataggio locale');
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        el.classList.add('hidden');
      }, 2200);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================================
    // C. LOGICA ROLLOVER GIORNALIERO (CHIUSURA GIORNATA & SPOSTAMENTO INCOMPLETE)
    // =========================================================================
    function performDailyRollover(forceNextDay = false) {
      const realToday = getTodayISO();
      if (!forceNextDay && state.currentDate === realToday) return;

      const oldDate = state.currentDate;
      const tasks = state.dailyItems.filter(i => i.type === 'task');
      const completedCount = tasks.filter(i => i.done).length;
      const pct = tasks.length > 0 ? Math.round((completedCount / tasks.length) * 100) : 100;

      // Salva nello storico se c'erano voci
      if (state.dailyItems.length > 0) {
        state.dailyHistory.unshift({
          id: uid('hist'),
          date: oldDate,
          completionPct: pct,
          items: JSON.parse(JSON.stringify(state.dailyItems))
        });
      }

      // Sposta le task NON completate nel contenitore fisso "Cose da fare / Reminder"
      const incompleteTasks = tasks.filter(t => !t.done);
      incompleteTasks.forEach(t => {
        state.reminders.unshift({
          id: uid('rem'),
          text: t.text,
          sourceDate: oldDate
        });
      });

      // Mantieni i trattini di routine come struttura base deselezionata per il nuovo giorno
      const routineTemplate = state.dailyItems
        .filter(i => i.type === 'routine')
        .map(r => ({ id: uid('d'), type: 'routine', text: r.text, done: false }));

      state.dailyItems = routineTemplate;
      state.currentDate = forceNextDay ? getTomorrowISO(oldDate) : realToday;
      saveState();

      if (incompleteTasks.length > 0) {
        showToast(`${incompleteTasks.length} attività non fatte spostate nei Reminder`);
      }
    }

    function getTomorrowISO(isoStr) {
      const [y, m, d] = isoStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + 1);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    // =========================================================================
    // D. NAVIGAZIONE TAB
    // =========================================================================
    function switchTab(tab) {
      activeTab = tab;
      const titles = {
        oggi: 'Oggi',
        archivio: 'Archivio & Reminder',
        percorsi: 'Percorsi & Report',
        finanze: 'Finanze'
      };
      document.getElementById('header-title').textContent = titles[tab] || 'Oggi';
      render();
    }

    function updateNavStyles() {
      ['oggi', 'archivio', 'percorsi', 'finanze'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (!btn) return;
        if (t === activeTab) {
          btn.classList.add('text-teal-400', 'bg-teal-500/10');
          btn.classList.remove('text-slate-500');
        } else {
          btn.classList.remove('text-teal-400', 'bg-teal-500/10');
          btn.classList.add('text-slate-500');
        }
      });
    }

    // =========================================================================
    // E. RENDER TAB 1: OGGI (LISTA CRONOLOGICA + AZIONI DEL MESE A PERCENTUALE)
    // =========================================================================
    function getDailyCompletionPct() {
      const tasks = state.dailyItems.filter(i => i.type === 'task');
      if (tasks.length === 0) return 0;
      const done = tasks.filter(i => i.done).length;
      return Math.round((done / tasks.length) * 100);
    }

    function getActionCurrentLog(action) {
      const key = action.frequency === 'weekly' ? getCurrentWeekKey() : state.currentDate;
      return action.logs[key] !== undefined ? action.logs[key] : 0;
    }

    function getActionMonthlyAverage(action) {
      const monthPrefix = state.currentDate.slice(0, 7);
      const entries = Object.entries(action.logs);
      if (entries.length === 0) return 0;
      const relevant = action.frequency === 'daily'
        ? entries.filter(([k]) => k.startsWith(monthPrefix))
        : entries;
      if (relevant.length === 0) return 0;
      const sum = relevant.reduce((acc, [, v]) => acc + Number(v || 0), 0);
      return Math.round(sum / relevant.length);
    }

                    ontouchstart="onTouchStartHandle(event, ${idx})"

      const actionsHtml = state.monthlyActions.length === 0

                class="px-3.5 py-2.5 rounded-2xl bg-gradient-to-r from-teal-500 to-sky-500 text-oled font-bold text-sm active:scale-95 transition shrink-0"
              >+</button>
            </form>
          </section>

          <!-- Blocco Azioni del Mese (a sfumature percentuali) -->
          <section class="bg-card border border-white/[0.08] rounded-3xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-sm font-bold text-white">Azioni del Mese</h3>
                <p class="text-[11px] text-slate-400">Consapevolezza a percentuali, zero pressione</p>
              </div>
              <button
                type="button"
                onclick="toggleExpandActionDetails()"
                class="text-xs font-medium text-teal-400 hover:text-teal-300 px-2.5 py-1.5 rounded-xl bg-teal-500/10"
              >
                ${state.expandActionDetails ? 'Nascondi tag ⌃' : 'Espandi dettagli ⌄'}
              </button>
            </div>

            <div class="space-y-2.5">
              ${actionsHtml}
            </div>
          </section>
        </div>
      `;
    }

    // Azioni Lista Giornaliera
    function toggleNewItemType() {
      state.newItemType = state.newItemType === 'routine' ? 'task' : 'routine';
      saveState();
      render();
      const inp = document.getElementById('new-daily-input');
      if (inp) inp.focus();
    }

    function addDailyItem(e) {
      e.preventDefault();
      const inp = document.getElementById('new-daily-input');
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) return;
      state.dailyItems.push({
        id: uid('d'),
        type: state.newItemType,
        text: val,
        done: false
      });
      saveState();
      render();
      const nextInp = document.getElementById('new-daily-input');
      if (nextInp) nextInp.focus();
    }

    function toggleTaskDone(id) {
      const item = state.dailyItems.find(i => i.id === id);
      if (!item || item.type !== 'task') return;
      item.done = !item.done;
      saveState();
      render();
    }

    function toggleItemType(id) {
      const item = state.dailyItems.find(i => i.id === id);
      if (!item) return;
      item.type = item.type === 'task' ? 'routine' : 'task';
      if (item.type === 'routine') item.done = false;
      saveState();
      render();
    }

    function deleteDailyItem(id) {
      state.dailyItems = state.dailyItems.filter(i => i.id !== id);
      saveState();
      render();
    }

    function moveDailyItem(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= state.dailyItems.length) return;
      const temp = state.dailyItems[idx];
      state.dailyItems[idx] = state.dailyItems[target];
      state.dailyItems[target] = temp;
      saveState();
      render();
    }

    function editDailyItemText(id) {
      const item = state.dailyItems.find(i => i.id === id);
      if (!item) return;
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-bold text-white">Modifica voce</h3>
          <input id="edit-daily-text" type="text" value="${escapeHtml(item.text)}" class="w-full bg-[#0B0F19] border border-white/15 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-teal-400" />
          <div class="flex gap-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-2xl bg-white/[0.06] text-xs font-semibold text-slate-300">Annulla</button>
            <button type="button" onclick="saveEditedDailyItem('${id}')" class="flex-1 py-2.5 rounded-2xl bg-gradient-to-r from-teal-500 to-sky-500 text-xs font-bold text-oled">Salva</button>
          </div>
        </div>
      `);
    }

    function saveEditedDailyItem(id) {
      const inp = document.getElementById('edit-daily-text');
      const item = state.dailyItems.find(i => i.id === id);
      if (inp && item && inp.value.trim()) {
        item.text = inp.value.trim();
        saveState();
      }
      closeModal();
      render();
    }

    function confirmCloseDay() {
      const incomplete = state.dailyItems.filter(i => i.type === 'task' && !i.done).length;
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-bold text-white">Chiudere la giornata di oggi?</h3>
          <p class="text-xs text-slate-300 leading-relaxed">
            La scaletta di <b>${formatItalianDate(state.currentDate)}</b> verrà salvata nello storico.
            ${incomplete > 0 ? `Le <b>${incomplete} attività non spuntate</b> verranno spostate automaticamente nei Reminder in Archivio.` : 'Tutte le attività sono state completate!'}
          </p>
          <div class="flex gap-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-2xl bg-white/[0.06] text-xs font-semibold text-slate-300">Annulla</button>
            <button type="button" onclick="closeModal(); performDailyRollover(true); render();" class="flex-1 py-2.5 rounded-2xl bg-gradient-to-r from-teal-500 to-sky-500 text-xs font-bold text-oled">Passa a domani</button>
          </div>
        </div>
      `);
    }

    // Drag & Drop Desktop + Touch Mobile per riordino lista
    let dragSrcIdx = null;
    function onDragStartRow(e, idx) {
      dragSrcIdx = idx;
      e.currentTarget.classList.add('dragging-row');
      if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
    }
    function onDragOverRow(e) {
      e.preventDefault();
    }
    function onDropRow(e, targetIdx) {
      e.preventDefault();
      if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
      const moved = state.dailyItems.splice(dragSrcIdx, 1)[0];
      state.dailyItems.splice(targetIdx, 0, moved);
      dragSrcIdx = null;
      saveState();
      render();
    }
    function onDragEndRow(e) {
      e.currentTarget.classList.remove('dragging-row');
      dragSrcIdx = null;
    }

    let touchDragIdx = null;
    function onTouchStartHandle(e, idx) {
      touchDragIdx = idx;
      const row = e.currentTarget.closest('.daily-row');
      if (row) row.classList.add('dragging-row');
    }
    function onTouchMoveHandle(e) {
      if (touchDragIdx === null) return;
      e.preventDefault();
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetRow = el ? el.closest('.daily-row') : null;
      if (targetRow) {
        const targetIdx = Number(targetRow.getAttribute('data-idx'));
        if (!Number.isNaN(targetIdx) && targetIdx !== touchDragIdx) {
          const moved = state.dailyItems.splice(touchDragIdx, 1)[0];
          state.dailyItems.splice(targetIdx, 0, moved);
          touchDragIdx = targetIdx;
          saveState();
          render();
        }
      }
    }
    function onTouchEndHandle() {
      touchDragIdx = null;
      render();
    }

    // Azioni del Mese
    function toggleExpandActionDetails() {
      state.expandActionDetails = !state.expandActionDetails;
      saveState();
      render();
    }

    function updateActionPct(actionId, val) {
      const act = state.monthlyActions.find(a => a.id === actionId);
      if (!act) return;
      const key = act.frequency === 'weekly' ? getCurrentWeekKey() : state.currentDate;
      act.logs[key] = Number(val);
      saveState();
      render();
    }

    // =========================================================================
    // F. RENDER TAB 2: ARCHIVIO & REMINDER
    // =========================================================================
    function renderArchivio() {
      const remindersHtml = state.reminders.length === 0
        ? `<div class="text-xs text-slate-500 py-4 text-center">Nessun reminder in sospeso. Qui finiscono anche le attività non spuntate a fine giornata.</div>`
        : state.reminders.map(rem => `
            <div class="flex items-center justify-between gap-2.5 p-3 rounded-2xl bg-[#0B0F19] border border-white/[0.06]">
              <div class="min-w-0 flex-1">
                <p class="text-sm text-slate-100 leading-snug">${escapeHtml(rem.text)}</p>
                ${rem.sourceDate ? `<span class="text-[10px] text-amber-400/90">Riportato dal ${formatItalianDate(rem.sourceDate)}</span>` : `<span class="text-[10px] text-slate-500">Promemoria futuro</span>`}
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button
                  type="button"
                  onclick="moveReminderToToday('${rem.id}')"
                  class="px-2.5 py-1.5 rounded-xl bg-teal-500/15 hover:bg-teal-500/25 border border-teal-500/30 text-[11px] font-semibold text-teal-300 active:scale-95 transition"
                >→ Oggi</button>
                <button
                  type="button"
                  onclick="deleteReminder('${rem.id}')"
                  aria-label="Elimina reminder"
                  class="p-1.5 rounded-xl text-slate-500 hover:text-rose-400"
                >
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </div>
          `).join('');

      const historyHtml = state.dailyHistory.length === 0
        ? `<div class="text-xs text-slate-500 py-5 text-center">Lo storico apparirà qui mano a mano che chiudi le giornate.</div>`
        : state.dailyHistory.map(h => {
            const isOpen = !!state.expandedPastDays[h.id];
            return `
              <div class="rounded-2xl bg-card border border-white/[0.07] overflow-hidden">
                <button
                  type="button"
                  onclick="togglePastDay('${h.id}')"
                  class="w-full px-4 py-3 flex items-center justify-between text-left hover:bg-cardHover transition"
                >
                  <div>
                    <div class="text-sm font-semibold text-white">${formatItalianDate(h.date)}</div>
                    <div class="text-[11px] text-slate-400">${h.items.length} elementi registrati</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
                      h.completionPct >= 75 ? 'bg-teal-500/15 text-teal-300' : 'bg-purple-500/15 text-purple-300'
                    }">${h.completionPct}%</span>
                    <span class="text-slate-400 text-xs">${isOpen ? '⌃' : '⌄'}</span>
                  </div>
                </button>
                ${isOpen ? `
                  <div class="px-4 pb-3 pt-1 border-t border-white/[0.05] space-y-1.5 bg-[#0B0F19]">
                    ${h.items.map(it => `
                      <div class="flex items-center gap-2 text-xs py-1 ${it.type === 'task' ? (it.done ? 'text-teal-300' : 'text-rose-300/80') : 'text-slate-500'}">
                        <span>${it.type === 'task' ? (it.done ? '☑' : '☐') : '—'}</span>
                        <span class="${it.done ? 'line-through opacity-80' : ''}">${escapeHtml(it.text)}</span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('');

      return `
        <div class="space-y-5 animate-fade">
          <!-- Contenitore Fisso in Alto: Cose da fare / Reminder -->
          <section class="bg-card border border-teal-500/25 rounded-3xl p-4 space-y-3 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[10px] font-semibold uppercase tracking-widest text-teal-400">Fisso in cima</span>
                <h2 class="text-base font-bold text-white">Cose da fare / Reminder</h2>
              </div>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-white/[0.06] text-slate-300">${state.reminders.length}</span>
            </div>

            <form onsubmit="addReminder(event)" class="flex items-center gap-2">
              <input
                id="new-reminder-input"
                type="text"
                placeholder="Es. Vedere video X, chiamare..."
                class="flex-1 bg-[#0B0F19] border border-white/10 rounded-2xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-teal-400"
              />
              <button type="submit" class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-teal-500 to-sky-500 text-oled font-bold text-sm active:scale-95 transition">+</button>
            </form>

            <div class="space-y-2 max-h-72 overflow-y-auto pr-0.5">
              ${remindersHtml}
            </div>
          </section>

          <!-- Cronologia Liste Passate -->
          <section class="space-y-2.5">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">Cronologia Passata</h3>
            ${historyHtml}
          </section>
        </div>
      `;
    }

    function addReminder(e) {
      e.preventDefault();
      const inp = document.getElementById('new-reminder-input');
      if (!inp || !inp.value.trim()) return;
      state.reminders.unshift({
        id: uid('rem'),
        text: inp.value.trim(),
        sourceDate: null
      });
      saveState();
      render();
    }

    function moveReminderToToday(id) {
      const idx = state.reminders.findIndex(r => r.id === id);
      if (idx === -1) return;
      const [rem] = state.reminders.splice(idx, 1);
      state.dailyItems.push({
        id: uid('d'),
        type: 'task',
        text: rem.text,
        done: false
      });
      saveState();
      showToast('Spostato nella scaletta di Oggi');
      render();
    }

    function deleteReminder(id) {
      state.reminders = state.reminders.filter(r => r.id !== id);
      saveState();
      render();
    }

    function togglePastDay(id) {
      state.expandedPastDays[id] = !state.expandedPastDays[id];
      saveState();
      render();
    }

    // =========================================================================
    // G. RENDER TAB 3: PERCORSI & REPORT MENSILE
    // =========================================================================
    function isStepActiveInMonth(stepId) {
      return state.monthlyActions.some(a => a.stepId === stepId);
    }

    function isSubGoalActiveInMonth(sg) {
      return sg.steps.some(st => isStepActiveInMonth(st.id));
    }

    function renderPercorsi() {
      const subTab = state.percorsiSubTab;

      const switcherHtml = `
        <div class="grid grid-cols-2 p-1 rounded-2xl bg-card border border-white/[0.08]">
          <button
            type="button"
            onclick="setPercorsiSubTab('albero')"
            class="py-2 rounded-xl text-xs font-semibold transition ${
              subTab === 'albero' ? 'bg-gradient-to-r from-teal-500 to-sky-500 text-oled' : 'text-slate-400 hover:text-white'
            }"
          >Percorsi & Obiettivi</button>
          <button
            type="button"
            onclick="setPercorsiSubTab('report')"
            class="py-2 rounded-xl text-xs font-semibold transition ${
              subTab === 'report' ? 'bg-gradient-to-r from-teal-500 to-sky-500 text-oled' : 'text-slate-400 hover:text-white'
            }"
          >Report Mensile</button>
        </div>
      `;

      if (subTab === 'report') {
        return `
          <div class="space-y-5 animate-fade">
            ${switcherHtml}
            ${renderReportMensileView()}
          </div>
        `;
      }

      // Vista Albero Percorsi + 10 Obiettivi di Vita
      const treeHtml = state.categoriesTree.map(cat => {
        const isCatOpen = !!state.expandedTreeNodes[cat.id];
        const activeCount = state.monthlyActions.filter(a => a.categoryId === cat.id).length;

        return `
          <div class="rounded-3xl bg-card border border-white/[0.08] overflow-hidden">
            <button
              type="button"
              onclick="toggleTreeNode('${cat.id}')"
              class="w-full p-4 flex items-center justify-between text-left hover:bg-cardHover transition"
            >
              <div class="min-w-0 pr-2">
                <div class="flex items-center gap-2">
                  <h3 class="text-base font-bold text-white">${escapeHtml(cat.name)}</h3>
                  ${activeCount > 0 ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-teal-500/20 text-teal-300">${activeCount} attive</span>` : ''}
                </div>
                <p class="text-[11px] text-slate-400 mt-0.5 line-clamp-1">${escapeHtml(cat.objective)}</p>
              </div>
              <span class="text-slate-400 text-sm shrink-0">${isCatOpen ? '⌃' : '⌄'}</span>
            </button>

            ${isCatOpen ? `
              <div class="px-4 pb-4 pt-1 border-t border-white/[0.06] space-y-3 bg-[#0B0F19]">
                <div class="flex items-center justify-between pt-2">
                  <p class="text-[11px] text-slate-300 italic">${escapeHtml(cat.objective)}</p>
                  <button type="button" onclick="openAddSubGoalModal('${cat.id}')" class="text-[11px] font-semibold text-teal-400 shrink-0 ml-2">+ Sotto-obiettivo</button>
                </div>

                ${cat.subGoals.map(sg => {
                  const sgActive = isSubGoalActiveInMonth(sg);
                  const isSgOpen = state.expandedTreeNodes[sg.id] !== false; // aperto di default dentro categoria aperta
                  return `
                    <div class="rounded-2xl bg-card border ${sgActive ? 'border-teal-500/35' : 'border-white/[0.06]'} p-3 space-y-2.5">
                      <div class="flex items-start justify-between gap-2">
                        <button type="button" onclick="toggleTreeNode('${sg.id}')" class="text-left flex-1">
                          <div class="flex flex-wrap items-center gap-1.5">
                            <span class="text-xs font-bold text-white">${escapeHtml(sg.title)}</span>
                            ${sgActive ? `<span class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-teal-500/20 text-teal-300">Attivo questo mese</span>` : ''}
                          </div>
                        </button>
                        <div class="flex items-center gap-1 shrink-0">
                          <button type="button" onclick="openAddStepModal('${cat.id}', '${sg.id}')" class="text-[11px] text-sky-400 px-1.5 py-0.5 rounded hover:bg-white/5">+ Step</button>
                          <button type="button" onclick="deleteSubGoal('${cat.id}', '${sg.id}')" class="text-[11px] text-slate-500 hover:text-rose-400 px-1">✕</button>
                        </div>
                      </div>

                      ${isSgOpen ? `
                        <div class="space-y-2 pt-1">
                          ${sg.steps.map(st => {
                            const activeAct = state.monthlyActions.find(a => a.stepId === st.id);
                            return `
                              <div class="p-2.5 rounded-xl bg-[#090D16] border border-white/[0.05] flex items-center justify-between gap-2">
                                <span class="text-xs text-slate-300 leading-snug flex-1">${escapeHtml(st.text)}</span>
                                <div class="flex items-center gap-1.5 shrink-0">
                                  ${activeAct ? `
                                    <button
                                      type="button"
                                      onclick="deactivateMonthlyAction('${activeAct.id}')"
                                      class="px-2 py-1 rounded-lg bg-teal-500/20 border border-teal-500/30 text-[10px] font-semibold text-teal-300"
                                      title="Tocca per rimuovere dalle azioni del mese"
                                    >✓ Nel mese</button>
                                  ` : `
                                    <button
                                      type="button"
                                      onclick="openActivateStepModal('${cat.id}', '${sg.id}', '${st.id}')"
                                      class="px-2 py-1 rounded-lg bg-white/[0.06] hover:bg-sky-500/20 text-[10px] font-semibold text-sky-300 transition"
                                    >+ Attiva</button>
                                  `}
                                  <button type="button" onclick="deleteStep('${cat.id}', '${sg.id}', '${st.id}')" class="text-slate-600 hover:text-rose-400 text-xs px-1">✕</button>
                                </div>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4 animate-fade">
          ${switcherHtml}

          <!-- I 10 Obiettivi di Vita (Collassabile) -->
          <section class="bg-card border border-white/[0.08] rounded-3xl overflow-hidden">
            <button
              type="button"
              onclick="toggleLifeGoals()"
              class="w-full px-4 py-3.5 flex items-center justify-between text-left"
            >
              <div>
                <span class="text-[10px] font-semibold uppercase tracking-widest text-purple-400">Bussola Generale</span>
                <h2 class="text-sm font-bold text-white">I miei 10 Obiettivi di Vita</h2>
              </div>
              <span class="text-xs text-slate-400">${state.showLifeGoals ? 'Chiudi ⌃' : 'Mostra ⌄'}</span>
            </button>
            ${state.showLifeGoals ? `
              <div class="px-4 pb-4 pt-1 border-t border-white/[0.06] space-y-1.5 bg-[#0B0F19]">
                ${state.lifeGoals.map(g => `<p class="text-xs text-slate-300 py-0.5">${escapeHtml(g)}</p>`).join('')}
              </div>
            ` : ''}
          </section>

          <!-- Albero delle 4 Macro-Aree -->
          <div class="space-y-3">
            ${treeHtml}
          </div>
        </div>
      `;
    }

    function renderReportMensileView() {
      const monthKey = getCurrentMonthKey();
      const refl = state.monthlyReflections[monthKey] || { worked: '', improve: '' };

      const catStats = state.categoriesTree.map(cat => {
        const acts = state.monthlyActions.filter(a => a.categoryId === cat.id);
        const avg = acts.length > 0
          ? Math.round(acts.reduce((acc, a) => acc + getActionMonthlyAverage(a), 0) / acts.length)
          : null;
        return { name: cat.name, count: acts.length, avg };
      });

      return `
        <div class="space-y-4">
          <section class="bg-card border border-white/[0.08] rounded-3xl p-4 space-y-3">
            <div>
              <span class="text-[10px] font-semibold uppercase tracking-widest text-teal-400">Analisi Consapevolezza</span>
              <h2 class="text-base font-bold text-white">Report • ${formatMonthLabel(monthKey)}</h2>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              ${catStats.map(cs => `
                <div class="p-3 rounded-2xl bg-[#0B0F19] border border-white/[0.06]">
                  <div class="text-xs font-semibold text-slate-300 truncate">${escapeHtml(cs.name)}</div>
                  <div class="mt-1.5 flex items-baseline justify-between">
                    <span class="text-lg font-bold ${cs.avg !== null ? 'text-teal-400' : 'text-slate-600'}">${cs.avg !== null ? cs.avg + '%' : '—'}</span>
                    <span class="text-[10px] text-slate-500">${cs.count} azioni</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- Dettaglio singole azioni attive -->
            <div class="pt-2 border-t border-white/[0.06] space-y-2">
              <h4 class="text-xs font-semibold text-slate-400">Medie Azioni Attive nel Mese</h4>
              ${state.monthlyActions.length === 0
                ? `<p class="text-xs text-slate-500">Nessuna azione attiva nel mese.</p>`
                : state.monthlyActions.map(a => {
                    const avg = getActionMonthlyAverage(a);
                    return `
                      <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                          <span class="text-slate-200 truncate pr-2">${escapeHtml(a.title)}</span>
                          <span class="font-bold text-teal-400 shrink-0">${avg}%</span>
                        </div>
                        <div class="w-full h-1.5 rounded-full bg-[#1D2436] overflow-hidden">
                          <div class="h-full rounded-full bg-gradient-to-r from-teal-400 to-purple-500" style="width: ${avg}%"></div>
                        </div>
                      </div>
                    `;
                  }).join('')
              }
            </div>
          </section>

          <!-- Riflessione di Fine Mese -->

                class="w-full bg-[#0B0F19] border border-white/10 rounded-2xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-teal-400"
              >${escapeHtml(refl.worked)}</textarea>

            <div class="space-y-1.5">
