              <textarea
                rows="3"
                oninput="saveMonthlyReflection('improve', this.value)"
                placeholder="Aggiustamenti per il prossimo ciclo..."
                class="w-full bg-[#0B0F19] border border-white/10 rounded-2xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-400"
              >${escapeHtml(refl.improve)}</textarea>
            </div>
          </section>
        </div>
      `;
    }

    function setPercorsiSubTab(st) {
      state.percorsiSubTab = st;
      saveState();
      render();
    }

    function toggleLifeGoals() {
      state.showLifeGoals = !state.showLifeGoals;
      saveState();
      render();
    }

    function toggleTreeNode(nodeId) {
      state.expandedTreeNodes[nodeId] = !(state.expandedTreeNodes[nodeId] !== false && nodeId.startsWith('sg_') ? true : !!state.expandedTreeNodes[nodeId]);
      saveState();
      render();
    }

    function openAddSubGoalModal(catId) {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-bold text-white">Nuovo Sotto-obiettivo</h3>
          <input id="new-sg-title" type="text" placeholder="Titolo sotto-obiettivo..." class="w-full bg-[#0B0F19] border border-white/15 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-teal-400" />
          <div class="flex gap-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-2xl bg-white/[0.06] text-xs font-semibold text-slate-300">Annulla</button>
            <button type="button" onclick="saveNewSubGoal('${catId}')" class="flex-1 py-2.5 rounded-2xl bg-gradient-to-r from-teal-500 to-sky-500 text-xs font-bold text-oled">Aggiungi</button>
          </div>
        </div>
      `);
    }

    function saveNewSubGoal(catId) {
      const inp = document.getElementById('new-sg-title');
      const cat = state.categoriesTree.find(c => c.id === catId);
      if (inp && cat && inp.value.trim()) {
        const newId = uid('sg');
        cat.subGoals.push({ id: newId, title: inp.value.trim(), steps: [] });
        state.expandedTreeNodes[newId] = true;
        saveState();
      }
      closeModal();
      render();
    }

    function deleteSubGoal(catId, sgId) {
      const cat = state.categoriesTree.find(c => c.id === catId);
      if (!cat) return;
      cat.subGoals = cat.subGoals.filter(s => s.id !== sgId);
      saveState();
      render();
    }

    function openAddStepModal(catId, sgId) {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-bold text-white">Nuova Azione / Step</h3>
          <input id="new-step-text" type="text" placeholder="Descrizione azione concreta..." class="w-full bg-[#0B0F19] border border-white/15 rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-teal-400" />
          <div class="flex gap-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-2xl bg-white/[0.06] text-xs font-semibold text-slate-300">Annulla</button>
            <button type="button" onclick="saveNewStep('${catId}', '${sgId}')" class="flex-1 py-2.5 rounded-2xl bg-gradient-to-r from-teal-500 to-sky-500 text-xs font-bold text-oled">Aggiungi</button>
          </div>
        </div>
      `);
    }

    function saveNewStep(catId, sgId) {
      const inp = document.getElementById('new-step-text');
      const cat = state.categoriesTree.find(c => c.id === catId);
      const sg = cat ? cat.subGoals.find(s => s.id === sgId) : null;
      if (inp && sg && inp.value.trim()) {
        sg.steps.push({ id: uid('st'), text: inp.value.trim() });
        saveState();
      }
      closeModal();
      render();
    }

    function deleteStep(catId, sgId, stepId) {
      const cat = state.categoriesTree.find(c => c.id === catId);
      const sg = cat ? cat.subGoals.find(s => s.id === sgId) : null;
      if (!sg) return;
      sg.steps = sg.steps.filter(st => st.id !== stepId);
      state.monthlyActions = state.monthlyActions.filter(a => a.stepId !== stepId);
      saveState();
      render();
    }

    function openActivateStepModal(catId, sgId, stepId) {
      const cat = state.categoriesTree.find(c => c.id === catId);
      const sg = cat ? cat.subGoals.find(s => s.id === sgId) : null;
      const st = sg ? sg.steps.find(s => s.id === stepId) : null;
      if (!st) return;

      openModal(`
        <div class="space-y-4">
          <div>
            <span class="text-[10px] font-semibold uppercase tracking-widest text-teal-400">Attiva nel Mese</span>
            <h3 class="text-base font-bold text-white mt-0.5">${escapeHtml(st.text)}</h3>
            <p class="text-xs text-slate-400 mt-1">${escapeHtml(cat.name)} • ${escapeHtml(sg.title)}</p>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-300">Con che cadenza vuoi tracciarla?</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="confirmActivateStep('${catId}', '${sgId}', '${stepId}', 'daily')" class="p-3 rounded-2xl bg-teal-500/15 hover:bg-teal-500/25 border border-teal-500/35 text-xs font-bold text-teal-300">
                Giornaliera<br><span class="text-[10px] font-normal text-slate-400">% ogni giorno</span>
              </button>
              <button type="button" onclick="confirmActivateStep('${catId}', '${sgId}', '${stepId}', 'weekly')" class="p-3 rounded-2xl bg-purple-500/15 hover:bg-purple-500/25 border border-purple-500/35 text-xs font-bold text-purple-300">
                Settimanale<br><span class="text-[10px] font-normal text-slate-400">% a fine settimana</span>
              </button>
            </div>
          </div>
          <button type="button" onclick="closeModal()" class="w-full py-2.5 rounded-2xl bg-white/[0.06] text-xs font-semibold text-slate-400">Annulla</button>
        </div>
      `);
    }

    function confirmActivateStep(catId, sgId, stepId, frequency) {
      const cat = state.categoriesTree.find(c => c.id === catId);
      const sg = cat ? cat.subGoals.find(s => s.id === sgId) : null;
      const st = sg ? sg.steps.find(s => s.id === stepId) : null;
      if (!st) return;

      if (!state.monthlyActions.some(a => a.stepId === stepId)) {
        state.monthlyActions.push({
          id: uid('act'),
          title: st.text,
          frequency,
          categoryId: cat.id,
          categoryName: cat.name,
          subGoalId: sg.id,
          subGoalTitle: sg.title,
          stepId: st.id,
          logs: {}
        });
        saveState();
        showToast('Azione aggiunta alla schermata Oggi');
      }
      closeModal();
      render();
    }

    function deactivateMonthlyAction(actionId) {
      state.monthlyActions = state.monthlyActions.filter(a => a.id !== actionId);
      saveState();
      showToast('Rimossa dalle azioni del mese');
      render();
    }

    function saveMonthlyReflection(field, val) {
      const mk = getCurrentMonthKey();
      if (!state.monthlyReflections[mk]) {
        state.monthlyReflections[mk] = { worked: '', improve: '' };
      }
      state.monthlyReflections[mk][field] = val;
      saveState();
    }

    // =========================================================================
    // H. RENDER TAB 4: FINANZE PERSONALI (CONTO vs CONTANTI + 4 OPERAZIONI)
    // =========================================================================
    function formatEuro(num) {
      return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(Number(num || 0));
    }

    function computeBalances() {
      let bank = Number(state.finance.initialBank || 0);
      let cash = Number(state.finance.initialCash || 0);

      state.finance.transactions.forEach(tx => {
        const amt = Number(tx.amount || 0);
        if (tx.type === 'expense') {
          if (tx.wallet === 'bank') bank -= amt;
          else cash -= amt;
        } else if (tx.type === 'income') {
          if (tx.wallet === 'bank') bank += amt;
          else cash += amt;
        } else if (tx.type === 'withdraw') {
          // Prelievo: - Conto Corrente, + Contanti
          bank -= amt;
          cash += amt;
        } else if (tx.type === 'deposit') {
          // Versamento: - Contanti, + Conto Corrente
          cash -= amt;
          bank += amt;
        }
      });

      return { bank, cash, total: bank + cash };
    }

    const CHART_COLORS = [
      '#2DD4BF', '#38BDF8', '#A855F7', '#F472B6', '#FB923C',
      '#FACC15', '#4ADE80', '#818CF8', '#22D3EE', '#E879F9',
      '#F87171', '#94A3B8', '#34D399', '#60A5FA'
    ];

    function renderFinanze() {
      const { bank, cash, total } = computeBalances();
      const period = state.finanzePeriod; // 'mensile' | 'annuale'
      const currentMonth = getCurrentMonthKey();
      const currentYear = getTodayISO().slice(0, 4);

      const periodTxs = state.finance.transactions.filter(tx =>
        period === 'mensile' ? tx.date.startsWith(currentMonth) : tx.date.startsWith(currentYear)
      );

      const expenses = periodTxs.filter(t => t.type === 'expense');
      const incomes = periodTxs.filter(t => t.type === 'income');

      const totalExpense = expenses.reduce((s, t) => s + Number(t.amount), 0);
      const totalIncome = incomes.reduce((s, t) => s + Number(t.amount), 0);

      // Raggruppa uscite per categoria
      const catMap = {};
      expenses.forEach(t => {
        catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount);
      });
      const rankedCats = Object.entries(catMap)
        .map(([name, amount], i) => ({
          name,
          amount,
          pct: totalExpense > 0 ? Math.round((amount / totalExpense) * 100) : 0,
          color: CHART_COLORS[i % CHART_COLORS.length]
        }))
        .sort((a, b) => b.amount - a.amount);

      // Costruzione SVG Donut Chart
      const r = 42;
      const circ = 2 * Math.PI * r;
      let cumulativeDash = 0;
      const donutSegments = rankedCats.length === 0
        ? `<circle cx="55" cy="55" r="${r}" stroke="#1D2436" stroke-width="14" fill="transparent" />`
        : rankedCats.map(c => {
            const segLen = (c.amount / totalExpense) * circ;
            const seg = `
              <circle
                cx="55" cy="55" r="${r}"
                stroke="${c.color}"
                stroke-width="14"
                stroke-dasharray="${segLen} ${circ}"
                stroke-dashoffset="${-cumulativeDash}"
                fill="transparent"
              />
            `;
            cumulativeDash += segLen;
            return seg;
          }).join('');

      const filteredHistory = state.finance.transactions.filter(tx => {
        if (state.finanzeFilter === 'all') return true;
        return tx.type === state.finanzeFilter;
      });

      const txTypeLabels = {
        expense: { label: 'Uscita', badge: 'bg-rose-500/15 text-rose-300', sign: '-' },
        income: { label: 'Entrata', badge: 'bg-emerald-500/15 text-emerald-300', sign: '+' },
        withdraw: { label: 'Prelievo', badge: 'bg-amber-500/15 text-amber-300', sign: '⇄' },
        deposit: { label: 'Versamento', badge: 'bg-sky-500/15 text-sky-300', sign: '⇄' }
      };

      return `
        <div class="space-y-4 animate-fade">
          <!-- Saldi Conto Corrente, Contanti e Totale -->
          <section class="grid grid-cols-3 gap-2">
            <button type="button" onclick="openEditInitialBalancesModal()" class="p-3 rounded-2xl bg-card border border-sky-500/25 text-left hover:bg-cardHover transition">
              <span class="text-[10px] font-semibold text-sky-400 block">Conto Corrente</span>
              <span class="text-sm font-bold text-white mt-1 block truncate">${formatEuro(bank)}</span>
            </button>
            <button type="button" onclick="openEditInitialBalancesModal()" class="p-3 rounded-2xl bg-card border border-teal-500/25 text-left hover:bg-cardHover transition">
              <span class="text-[10px] font-semibold text-teal-400 block">Contanti</span>
              <span class="text-sm font-bold text-white mt-1 block truncate">${formatEuro(cash)}</span>
            </button>
            <div class="p-3 rounded-2xl bg-gradient-to-br from-purple-500/15 to-sky-500/15 border border-white/10 text-left">
              <span class="text-[10px] font-semibold text-purple-300 block">Totale</span>
              <span class="text-sm font-bold text-white mt-1 block truncate">${formatEuro(total)}</span>
            </div>
          </section>

          <!-- Selettore Mensile / Annuale -->
          <div class="grid grid-cols-2 p-1 rounded-2xl bg-card border border-white/[0.08]">
            <button
              type="button"
              onclick="setFinanzePeriod('mensile')"
              class="py-2 rounded-xl text-xs font-semibold transition ${
                period === 'mensile' ? 'bg-gradient-to-r from-teal-500 to-sky-500 text-oled' : 'text-slate-400 hover:text-white'
              }"
            >Mensile (${formatMonthLabel(currentMonth).split(' ')[0]})</button>
            <button
              type="button"
              onclick="setFinanzePeriod('annuale')"
              class="py-2 rounded-xl text-xs font-semibold transition ${
                period === 'annuale' ? 'bg-gradient-to-r from-teal-500 to-sky-500 text-oled' : 'text-slate-400 hover:text-white'
              }"
            >Annuale (${currentYear})</button>
          </div>

          <!-- Overview Spese & Grafico a Ciambella -->
          <section class="bg-card border border-white/[0.08] rounded-3xl p-4 space-y-4">
            <div class="flex items-center justify-between text-xs">
              <div>
                <span class="text-slate-400 block">Entrate ${period}</span>
                <span class="text-sm font-bold text-emerald-400">+${formatEuro(totalIncome)}</span>
              </div>
              <div class="text-right">
                <span class="text-slate-400 block">Uscite ${period}</span>
                <span class="text-sm font-bold text-rose-400">-${formatEuro(totalExpense)}</span>
              </div>
            </div>

            <div class="flex items-center gap-4">
              <div class="relative w-28 h-28 shrink-0 flex items-center justify-center">
                <svg class="w-28 h-28 -rotate-90" viewBox="0 0 110 110">
                  ${donutSegments}
                </svg>
                <div class="absolute text-center">
                  <span class="text-[9px] uppercase text-slate-400 block">Uscite</span>
                  <span class="text-xs font-bold text-white">${rankedCats.length > 0 ? rankedCats[0].pct + '%' : '0%'}</span>
                </div>
              </div>

              <div class="flex-1 min-w-0 space-y-1.5">
                ${rankedCats.length === 0
                  ? `<p class="text-xs text-slate-500">Nessuna uscita registrata nel periodo selezionato.</p>`
                  : rankedCats.slice(0, 4).map(c => `
                      <div class="flex items-center justify-between text-xs gap-2">
                        <div class="flex items-center gap-1.5 min-w-0">
                          <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${c.color}"></span>
                          <span class="text-slate-200 truncate">${escapeHtml(c.name)}</span>
                        </div>
                        <span class="font-semibold text-slate-300 shrink-0">${c.pct}%</span>
                      </div>
                    `).join('')
                }
              </div>
            </div>

            <!-- Classifica dove spendi di più -->
            ${rankedCats.length > 0 ? `
              <div class="pt-3 border-t border-white/[0.06] space-y-2">
                <span class="text-[11px] font-semibold text-slate-400 block">Dove spendi di più</span>
                ${rankedCats.map(c => `
                  <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                      <span class="text-slate-200">${escapeHtml(c.name)}</span>
                      <span class="font-semibold text-white">${formatEuro(c.amount)} <span class="text-slate-400 font-normal">(${c.pct}%)</span></span>
                    </div>
                    <div class="w-full h-1.5 rounded-full bg-[#1D2436] overflow-hidden">
                      <div class="h-full rounded-full" style="width:${c.pct}%; background:${c.color}"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </section>

          <!-- Storico Transazioni Espandibile -->
          <section class="bg-card border border-white/[0.08] rounded-3xl overflow-hidden">
            <button
              type="button"
              onclick="toggleTxHistory()"
              class="w-full px-4 py-3.5 flex items-center justify-between text-left"
            >
              <span class="text-sm font-bold text-white">Storico Transazioni (${state.finance.transactions.length})</span>
              <span class="text-xs text-teal-400">${state.showTxHistory ? 'Chiudi ⌃' : 'Apri ⌄'}</span>
            </button>

            ${state.showTxHistory ? `
              <div class="px-4 pb-4 pt-1 border-t border-white/[0.06] space-y-3 bg-[#0B0F19]">
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar pt-2">
                  ${[
                    { id: 'all', label: 'Tutte' },
                    { id: 'expense', label: 'Uscite' },
                    { id: 'income', label: 'Entrate' },
                    { id: 'withdraw', label: 'Prelievi' },
                    { id: 'deposit', label: 'Versamenti' }
                  ].map(f => `
                    <button
                      type="button"
                      onclick="setFinanzeFilter('${f.id}')"
                      class="px-2.5 py-1 rounded-xl text-[11px] font-semibold shrink-0 ${
                        state.finanzeFilter === f.id ? 'bg-teal-500 text-oled' : 'bg-white/[0.05] text-slate-400'
                      }"
                    >${f.label}</button>
                  `).join('')}
                </div>

                <div class="space-y-2 max-h-64 overflow-y-auto">
                  ${filteredHistory.length === 0
                    ? `<p class="text-xs text-slate-500 py-3 text-center">Nessuna transazione trovata.</p>`
                    : filteredHistory.map(tx => {
                        const meta = txTypeLabels[tx.type] || txTypeLabels.expense;
                        const walletTxt = tx.type === 'withdraw'
                          ? 'Conto → Contanti'
                          : tx.type === 'deposit'
                            ? 'Contanti → Conto'
                            : (tx.wallet === 'bank' ? 'Conto Corrente' : 'Contanti');
                        return `
                          <div class="flex items-center justify-between gap-2 p-2.5 rounded-2xl bg-card border border-white/[0.05]">
                            <div class="min-w-0">
                              <div class="flex items-center gap-1.5">
                                <span class="text-[10px] px-1.5 py-0.5 rounded font-semibold ${meta.badge}">${meta.label}</span>
                                <span class="text-xs font-semibold text-white truncate">${escapeHtml(tx.category || meta.label)}</span>
                              </div>
                              <div class="text-[10px] text-slate-400 mt-0.5">
                                ${tx.date} • ${walletTxt}${tx.note ? ` • ${escapeHtml(tx.note)}` : ''}
                              </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                              <span class="text-xs font-bold text-slate-100">${meta.sign}${formatEuro(tx.amount)}</span>
                              <button type="button" onclick="deleteTransaction('${tx.id}')" class="text-slate-500 hover:text-rose-400 text-xs">✕</button>
                            </div>
                          </div>
                        `;
                      }).join('')
                  }
                </div>
              </div>
            ` : ''}
          </section>

          <!-- Pulsante Scarica Recap Mensile + Tasto + Nuova Operazione -->
          <div class="flex items-center gap-3 pt-1">
            <button
              type="button"
              onclick="downloadMonthlyFinanceCSV()"
              class="flex-1 py-3.5 px-4 rounded-2xl bg-card hover:bg-cardHover border border-white/10 text-xs font-semibold text-slate-200 flex items-center justify-center gap-2 active:scale-95 transition"
            >
              <svg class="w-4 h-4 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              Scarica Recap Mensile
            </button>
            <button
              type="button"
              onclick="openNewTransactionModal('expense')"
              aria-label="Nuova operazione finanziaria"
              class="w-13 h-13 px-5 py-3.5 rounded-2xl bg-gradient-to-tr from-teal-400 via-sky-400 to-purple-500 text-oled font-bold text-lg shadow-lg active:scale-95 transition"
            >+</button>
          </div>
        </div>
      `;
    }

    function setFinanzePeriod(p) {
      state.finanzePeriod = p;
      saveState();
      render();
    }

    function toggleTxHistory() {
      state.showTxHistory = !state.showTxHistory;
      saveState();
      render();
    }

    function setFinanzeFilter(f) {
      state.finanzeFilter = f;
      saveState();
      render();
    }

    function deleteTransaction(id) {
      state.finance.transactions = state.finance.transactions.filter(t => t.id !== id);
      saveState();
      showToast('Operazione eliminata');
      render();
    }

    function openEditInitialBalancesModal() {
      openModal(`
        <div class="space-y-4">
          <div>
            <span class="text-[10px] font-semibold uppercase tracking-widest text-teal-400">Budget di Partenza</span>
            <h3 class="text-base font-bold text-white">Saldi Iniziali</h3>
          </div>
          <div class="space-y-3">
            <div>
              <label class="text-xs text-slate-300 block mb-1">Saldo iniziale Conto Corrente (€)</label>
              <input id="init-bank-inp" type="number" step="0.01" value="${state.finance.initialBank}" class="w-full bg-[#0B0F19] border border-white/15 rounded-2xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400" />
            </div>
            <div>
              <label class="text-xs text-slate-300 block mb-1">Saldo iniziale Contanti (€)</label>
              <input id="init-cash-inp" type="number" step="0.01" value="${state.finance.initialCash}" class="w-full bg-[#0B0F19] border border-white/15 rounded-2xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-teal-400" />
            </div>
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-2xl bg-white/[0.06] text-xs font-semibold text-slate-300">Annulla</button>
            <button type="button" onclick="saveInitialBalances()" class="flex-1 py-2.5 rounded-2xl bg-gradient-to-r from-teal-500 to-sky-500 text-xs font-bold text-oled">Salva Saldi</button>
          </div>
        </div>
      `);
    }

    function saveInitialBalances() {
      const b = parseFloat(document.getElementById('init-bank-inp').value);
      const c = parseFloat(document.getElementById('init-cash-inp').value);
      if (!Number.isNaN(b)) state.finance.initialBank = b;
      if (!Number.isNaN(c)) state.finance.initialCash = c;
      saveState();
      closeModal();
      showToast('Saldi iniziali aggiornati');
      render();
    }

    // Modale Nuova Operazione (Uscita, Entrata, Prelievo, Versamento)
    let txModalType = 'expense';
    let txModalWallet = 'bank';
    let txModalCategory = '';

    function openNewTransactionModal(type = 'expense') {
      txModalType = type;
      txModalWallet = 'bank';
      const cats = type === 'income' ? state.finance.incomeCategories : state.finance.expenseCategories;
      txModalCategory = cats[0] || 'Altro';
      renderTransactionModalContent();
    }

    function setTxModalType(t) {
      txModalType = t;
      const cats = t === 'income' ? state.finance.incomeCategories : state.finance.expenseCategories;
      txModalCategory = cats[0] || 'Altro';
      renderTransactionModalContent();
    }

    function setTxModalWallet(w) {
      txModalWallet = w;
      renderTransactionModalContent();
    }

    function setTxModalCategory(c) {
      txModalCategory = c;
      renderTransactionModalContent();
    }

    function renderTransactionModalContent() {
      const isTransfer = txModalType === 'withdraw' || txModalType === 'deposit';
      const cats = txModalType === 'income' ? state.finance.incomeCategories : state.finance.expenseCategories;

      openModal(`
        <form onsubmit="submitNewTransaction(event)" class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-bold text-white">Nuova Operazione</h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
          </div>

          <!-- 4 Tipi Operazione -->
          <div class="grid grid-cols-4 gap-1 p-1 rounded-2xl bg-[#0B0F19] border border-white/[0.08]">
            ${[
              { id: 'expense', label: 'Uscita' },
              { id: 'income', label: 'Entrata' },
              { id: 'withdraw', label: 'Prelievo' },
              { id: 'deposit', label: 'Versam.' }
            ].map(op => `
              <button
                type="button"
                onclick="setTxModalType('${op.id}')"
                class="py-2 rounded-xl text-[11px] font-bold transition ${
                  txModalType === op.id
                    ? 'bg-gradient-to-r from-teal-500 to-sky-500 text-oled'
                    : 'text-slate-400 hover:text-white'
                }"
              >${op.label}</button>
            `).join('')}
          </div>

          <!-- Importo -->
          <div>
            <label class="text-[11px] font-semibold text-slate-400 block mb-1">Importo (€)</label>
            <input
              id="tx-amount-input"
              type="number"
              step="0.01"
              min="0.01"
              required
              placeholder="0.00"
              class="w-full bg-[#0B0F19] border border-white/15 rounded-2xl px-4 py-3 text-xl font-bold text-white placeholder-slate-600 focus:outline-none focus:border-teal-400"
            />
          </div>

          <!-- Portafoglio oppure Spiegazione Giroconto -->
          ${isTransfer ? `
            <div class="p-3 rounded-2xl bg-white/[0.04] border border-white/[0.08] text-xs text-slate-300">
              ${txModalType === 'withdraw'
                ? '🏧 <b>Prelievo ATM:</b> scala l’importo dal <b>Conto Corrente</b> e lo aggiunge ai <b>Contanti</b>.'
                : '🏦 <b>Versamento:</b> scala l’importo dai <b>Contanti</b> e lo aggiunge al <b>Conto Corrente</b>.'}
            </div>
          ` : `
            <div>
              <label class="text-[11px] font-semibold text-slate-400 block mb-1.5">Metodo / Portafoglio</label>
              <div class="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onclick="setTxModalWallet('bank')"
                  class="py-2.5 rounded-2xl text-xs font-semibold border transition ${
                    txModalWallet === 'bank'
                      ? 'bg-sky-500/20 border-sky-400/50 text-sky-300'
                      : 'bg-[#0B0F19] border-white/10 text-slate-400'
                  }"
                >💳 Conto Corrente</button>
                <button
                  type="button"
                  onclick="setTxModalWallet('cash')"
                  class="py-2.5 rounded-2xl text-xs font-semibold border transition ${
                    txModalWallet === 'cash'
                      ? 'bg-teal-500/20 border-teal-400/50 text-teal-300'
                      : 'bg-[#0B0F19] border-white/10 text-slate-400'
                  }"
                >💵 Contanti</button>
              </div>
            </div>

            <!-- Categorie -->
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label class="text-[11px] font-semibold text-slate-400">Categoria</label>
                <button type="button" onclick="openManageCategoriesModal()" class="text-[11px] font-semibold text-teal-400">+ Modifica categorie</button>
              </div>
              <div class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-0.5">
                ${cats.map(cat => `
                  <button
                    type="button"
                    onclick="setTxModalCategory('${escapeHtml(cat)}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-medium border transition ${
                      txModalCategory === cat
                        ? 'bg-purple-500/25 border-purple-400 text-white'
                        : 'bg-[#0B0F19] border-white/10 text-slate-400 hover:text-slate-200'
                    }"
                  >${escapeHtml(cat)}</button>
                `).join('')}
              </div>
            </div>
          `}

          <!-- Data e Nota opzionale -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Data</label>
              <input id="tx-date-input" type="date" value="${state.currentDate}" class="w-full bg-[#0B0F19] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Nota (opzionale)</label>
              <input id="tx-note-input" type="text" placeholder="Dettaglio..." class="w-full bg-[#0B0F19] border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
          </div>

          <button type="submit" class="w-full py-3 rounded-2xl bg-gradient-to-r from-teal-500 via-sky-500 to-purple-500 text-oled font-bold text-sm shadow-lg active:scale-95 transition">
            Salva Operazione
          </button>
        </form>
      `);
    }

    function submitNewTransaction(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('tx-amount-input').value);
      if (Number.isNaN(amount) || amount <= 0) return;
      const date = document.getElementById('tx-date-input').value || state.currentDate;
      const note = document.getElementById('tx-note-input').value.trim();

      state.finance.transactions.unshift({
        id: uid('tx'),
        type: txModalType,
        amount,
        wallet: txModalWallet,
        category: (txModalType === 'withdraw' || txModalType === 'deposit') ? '' : txModalCategory,
        date,
        note
      });

      saveState();
      closeModal();
      showToast('Operazione registrata');
      render();
    }

    function openManageCategoriesModal() {
      const isIncome = txModalType === 'income';
      const list = isIncome ? state.finance.incomeCategories : state.finance.expenseCategories;

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-bold text-white">Categorie ${isIncome ? 'Entrate' : 'Uscite'}</h3>
            <button type="button" onclick="renderTransactionModalContent()" class="text-xs text-teal-400 font-semibold">← Indietro</button>
          </div>

          <form onsubmit="addFinanceCategory(event, ${isIncome})" class="flex gap-2">
            <input id="new-fcat-inp" type="text" placeholder="Nuova categoria..." class="flex-1 bg-[#0B0F19] border border-white/15 rounded-2xl px-3 py-2 text-xs text-white" />
            <button type="submit" class="px-3.5 py-2 rounded-2xl bg-teal-500 text-oled font-bold text-xs">+</button>
          </form>

          <div class="flex flex-wrap gap-1.5 max-h-56 overflow-y-auto">
            ${list.map(c => `
              <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#0B0F19] border border-white/10 text-xs text-slate-200">
                ${escapeHtml(c)}
                <button type="button" onclick="removeFinanceCategory('${escapeHtml(c)}', ${isIncome})" class="text-slate-500 hover:text-rose-400">✕</button>
              </span>
            `).join('')}
          </div>
        </div>
      `);
    }

    function addFinanceCategory(e, isIncome) {
      e.preventDefault();
      const inp = document.getElementById('new-fcat-inp');
      if (!inp || !inp.value.trim()) return;
      const val = inp.value.trim();
      const target = isIncome ? state.finance.incomeCategories : state.finance.expenseCategories;
      if (!target.includes(val)) {
        target.push(val);
        saveState();
      }
      openManageCategoriesModal();
    }

    function removeFinanceCategory(catName, isIncome) {
      if (isIncome) {
        state.finance.incomeCategories = state.finance.incomeCategories.filter(c => c !== catName);
      } else {
        state.finance.expenseCategories = state.finance.expenseCategories.filter(c => c !== catName);
      }
      saveState();
      openManageCategoriesModal();
    }

    function downloadMonthlyFinanceCSV() {
      const monthKey = getCurrentMonthKey();
      const txs = state.finance.transactions.filter(t => t.date.startsWith(monthKey));
      const { bank, cash, total } = computeBalances();

      const lines = [
        ['Data', 'Tipo', 'Portafoglio', 'Categoria', 'Importo EUR', 'Nota'].join(';')
      ];
      txs.forEach(t => {
        const tipo = t.type === 'expense' ? 'Uscita' : t.type === 'income' ? 'Entrata' : t.type === 'withdraw' ? 'Prelievo' : 'Versamento';
        const port = t.type === 'withdraw' ? 'Conto->Contanti' : t.type === 'deposit' ? 'Contanti->Conto' : (t.wallet === 'bank' ? 'Conto Corrente' : 'Contanti');
        lines.push([t.date, tipo, port, t.category || '-', Number(t.amount).toFixed(2), (t.note || '').replace(/;/g, ',')].join(';'));
      });
      lines.push('');
      lines.push(['Saldo Conto Corrente', bank.toFixed(2)].join(';'));
      lines.push(['Saldo Contanti', cash.toFixed(2)].join(';'));
      lines.push(['Saldo Totale', total.toFixed(2)].join(';'));

      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `recap_finanze_${monthKey}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Recap mensile scaricato');
    }

    // =========================================================================
    // I. MODALE IMPOSTAZIONI & BACKUP JSON 100% LOCALE
    // =========================================================================
    function openSettingsModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[10px] font-semibold uppercase tracking-widest text-teal-400">Sicurezza & Dati Locali</span>
              <h3 class="text-base font-bold text-white">Impostazioni & Backup</h3>
            </div>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
          </div>

          <p class="text-xs text-slate-400 leading-relaxed">
            Tutti i tuoi dati sono salvati esclusivamente nella memoria locale di questo iPhone. Esporta regolarmente un file <b class="text-slate-200">.json</b> sull'app File di iOS per avere una copia di sicurezza.
          </p>

          <div class="space-y-2.5">
            <button type="button" onclick="exportFullBackupJSON()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-teal-500 to-sky-500 text-xs font-bold text-oled active:scale-95 transition">
              ⬇ Esporta Backup Completo (.json)
            </button>

            <label class="block w-full py-3 rounded-2xl bg-white/[0.07] hover:bg-white/[0.12] text-center text-xs font-semibold text-white cursor-pointer transition">
              ⬆ Ripristina da file (.json)
              <input type="file" accept=".json,application/json" onchange="importFullBackupJSON(event)" class="hidden" />
            </label>

            <button type="button" onclick="openEditInitialBalancesModal()" class="w-full py-2.5 rounded-2xl bg-sky-500/15 border border-sky-500/30 text-xs font-semibold text-sky-300 transition">
              💳 Modifica Saldi Iniziali (Conto / Contanti)
            </button>

            <button type="button" onclick="lockAppManually()" class="w-full py-2.5 rounded-2xl bg-purple-500/15 border border-purple-500/30 text-xs font-semibold text-purple-200 transition">
              🔒 Blocca app ora (PIN)
            </button>
          </div>
        </div>
      `);
    }

    function exportFullBackupJSON() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_il_mio_spazio_${getTodayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Backup JSON esportato');
    }

    function importFullBackupJSON(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported && typeof imported === 'object') {
            state = { ...getDefaultState(), ...imported };
            saveState();
            closeModal();
            showToast('Backup ripristinato con successo');
            render();
          }
        } catch (err) {
          showToast('File JSON non valido');
        }
      };
      reader.readAsText(file);
    }

    // =========================================================================
    // J. HELPER MODALE E RENDER PRINCIPALE
    // =========================================================================
    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function render() {
      updateNavStyles();
      const main = document.getElementById('main-content');
      if (!main) return;

      if (activeTab === 'oggi') main.innerHTML = renderOggi();
      else if (activeTab === 'archivio') main.innerHTML = renderArchivio();
      else if (activeTab === 'percorsi') main.innerHTML = renderPercorsi();
      else if (activeTab === 'finanze') main.innerHTML = renderFinanze();
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (isAppUnlocked()) {
        unlockAppUI();
      } else {
        updatePinDotsUI();
      }
    });
  </script>
</body>
</html>
